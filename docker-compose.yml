services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: recsys_api
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=recsys
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - ADMIN_API_KEY=${ADMIN_API_KEY:-admin_secret_key_recsys_2026}
      - LLM_MODEL=${LLM_MODEL:-gemini-3.5-flash-lite}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    volumes:
      - ./data:/app/data:ro
      - ./models:/app/models:ro
      - ./embeddings:/app/embeddings:ro
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/v2/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 35s
    networks:
      - recsys_net

  postgres:
    image: postgres:16-alpine
    container_name: recsys_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: recsys
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d recsys"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - recsys_net

  redis:
    image: redis:7-alpine
    container_name: recsys_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - recsys_net

  qdrant:
    image: qdrant/qdrant:latest
    container_name: recsys_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/6333' || curl -s -f http://localhost:6333/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - recsys_net

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: recsys_web
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - recsys_net

networks:
  recsys_net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
