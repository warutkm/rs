name: CI Pipeline

"on":
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================================
  # 1. CODE STYLE & LINTING CHECK
  # =========================================================================
  lint:
    name: Lint & Style Check (flake8, black)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Lint Tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8==7.1.1 black==24.10.0

      - name: Run Flake8 Linter
        run: |
          flake8

      - name: Run Black Formatting Check
        run: |
          black --check .

  # =========================================================================
  # 2. UNIT & INTEGRATION TESTS
  # =========================================================================
  test:
    name: Unit & Integration Tests (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [lint]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Run Pytest Suite
        env:
          MLFLOW_TRACKING_URI: "file:./mlflow"
          MLFLOW_EXPERIMENT: "DS11-v2"
          ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY || 'ds11-test-retrain-secret-key-2026' }}
        run: |
          pytest -v

  # =========================================================================
  # 3. SMOKE RETRAIN (DVC DAG & Repro Check)
  # =========================================================================
  smoke-retrain:
    name: Smoke Retrain (DVC DAG Validation)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install DVC & Pipeline Tools
        run: |
          python -m pip install --upgrade pip
          pip install dvc==3.67.1 pyyaml==6.0.2

      - name: Create Pipeline Directories
        run: |
          mkdir -p data models embeddings outputs logs

      - name: Validate DVC DAG Graph Structure
        run: |
          dvc dag

      - name: Check DVC Stage Status
        run: |
          dvc status || true

  # =========================================================================
  # 4. FRONTEND NEXT.JS STATIC BUILD CHECK
  # =========================================================================
  frontend-build:
    name: Frontend Build Check (Next.js)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'

      - name: Install Web Dependencies
        run: |
          npm ci

      - name: Build Next.js Production Bundle
        env:
          NEXT_PUBLIC_API_URL: "http://localhost:8000"
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          npm run build

  # =========================================================================
  # 5. CONTAINER BUILD & DEPLOYMENT CHECK (On Release Tag)
  # =========================================================================
  deploy-on-tag:
    name: Build & Verify Container Image (Release Tag)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [test, smoke-retrain, frontend-build]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API Docker Image
        run: |
          echo "Building production Docker image for tag: ${{ github.ref_name }}"
          docker build -t amazon-recsys-api:${{ github.ref_name }} -f api/Dockerfile .

      - name: Verify Container Image
        run: |
          docker images amazon-recsys-api:${{ github.ref_name }}
          echo "✅ Release image amazon-recsys-api:${{ github.ref_name }} successfully built and verified."
